name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Chạy CI trên SQLite (không cần Postgres); LLM dùng mock (không cần khóa)
      DATABASE_URL: "sqlite+pysqlite:///./ci.db"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Cài đặt phụ thuộc
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (black)
        run: black --check .
      - name: Migrations + kiểm tra drift
        run: |
          alembic upgrade head
          alembic check
      - name: Test (pytest)
        run: pytest -q
      - name: Eval bộ chuẩn (cổng độ chính xác)
        working-directory: .
        run: python benchmark/run_eval.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Cài đặt phụ thuộc
        run: npm ci
      - name: Test (vitest)
        run: npm test
      - name: Build (Next.js + type-check)
        run: npm run build
